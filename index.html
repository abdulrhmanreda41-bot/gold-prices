<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسعار الذهب لايف | النسخة الاحترافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* الألوان الأساسية - Emerald & Gold */
            --bg-deep: #040906;
            --bg-radial: #0a1f12;
            --glass-bg: rgba(14, 33, 21, 0.45);
            --glass-border: rgba(212, 175, 55, 0.15);
            --gold-primary: #d4af37;
            --gold-light: #fbe69b;
            --text-main: #f0f5f1;
            --text-muted: #8ba696;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --shadow-subtle: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 50% 0%, var(--bg-radial) 0%, var(--bg-deep) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 20px;
        }

        /* --- Header & Controls --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 5px;
        }
        
        .title-wrapper h1 {
            font-size: 1.4rem;
            color: var(--gold-primary);
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        
        .last-update {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: -3px;
        }

        .refresh-btn {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--gold-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .refresh-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .refresh-btn.spinning {
            animation: spin 1s linear infinite;
            pointer-events: none;
            opacity: 0.7;
        }

        /* --- Glass Cards --- */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 18px;
            box-shadow: var(--shadow-subtle);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        /* لمسة لمعان علوية للبطاقة */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.5), transparent);
        }

        /* --- Main 21 Karat Card --- */
        .card-main {
            text-align: center;
            background: linear-gradient(145deg, rgba(20, 45, 28, 0.6) 0%, rgba(10, 24, 15, 0.6) 100%);
            border-color: rgba(212, 175, 55, 0.3);
        }
        
        .karat-badge {
            background: linear-gradient(45deg, var(--gold-primary), #e6c55c);
            color: #000;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.1rem;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        .price-grid {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .price-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .price-divider {
            width: 1px;
            height: 40px;
            background: var(--glass-border);
        }

        .price-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .price-value {
            font-size: 1.8rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums; /* لموازاة الأرقام */
        }

        .price-value.buy { color: var(--gold-primary); }
        .price-value.sell { color: var(--text-main); }

        /* --- Secondary Grid (24, 18, 14) --- */
        .karats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .karat-mini {
            padding: 12px;
            text-align: center;
        }

        .karat-mini .title {
            color: var(--gold-light);
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .karat-mini .mini-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 4px;
            font-variant-numeric: tabular-nums;
        }
        
        .karat-mini .mini-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: normal;
        }

        /* --- Info Cards (Coin, Gap, etc) --- */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .info-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 15px;
        }

        .info-card.full-width {
            grid-column: span 2;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }

        .info-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--gold-light);
        }

        .gap-value { color: var(--accent-red); font-size: 1.4rem;}
        
        /* --- Animations & Effects --- */
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* تأثير الوميض عند التحديث */
        @keyframes flashUpdate {
            0% { text-shadow: 0 0 15px var(--gold-primary); transform: scale(1.05); }
            100% { text-shadow: none; transform: scale(1); }
        }
        .flash {
            animation: flashUpdate 0.8s ease-out;
        }

        /* Loading Skeleton */
        .skeleton-text {
            position: relative;
            overflow: hidden;
            color: transparent !important;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.05);
            min-width: 40px;
            display: inline-block;
        }

        .skeleton-text::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.15), transparent);
            transform: translateX(-100%);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="header">
            <div class="title-wrapper">
                <h1>أسعار الذهب</h1>
                <div class="last-update" id="last-update-time">آخر تحديث: بانتظار الاتصال...</div>
            </div>
            <button class="refresh-btn" id="refresh-btn" onclick="fetchPrices()" title="تحديث الأسعار">
                ↻
            </button>
        </header>

        <div class="glass-card card-main">
            <div class="karat-badge">عيار 21</div>
            <div class="price-grid">
                <div class="price-col">
                    <span class="price-label">شراء (لك)</span>
                    <span class="price-value buy skeleton-text" id="buy-21" data-val="0">----</span>
                </div>
                <div class="price-divider"></div>
                <div class="price-col">
                    <span class="price-label">بيع (للصاغة)</span>
                    <span class="price-value sell skeleton-text" id="sell-21" data-val="0">----</span>
                </div>
            </div>
        </div>

        <div class="karats-grid">
            <div class="glass-card karat-mini">
                <div class="title">عيار 24</div>
                <div class="mini-row">
                    <span class="mini-label">شراء</span>
                    <span class="buy skeleton-text" id="buy-24" data-val="0">--</span>
                </div>
                <div class="mini-row">
                    <span class="mini-label">بيع</span>
                    <span class="sell skeleton-text" id="sell-24" data-val="0">--</span>
                </div>
            </div>
            
            <div class="glass-card karat-mini">
                <div class="title">عيار 18</div>
                <div class="mini-row">
                    <span class="mini-label">شراء</span>
                    <span class="buy skeleton-text" id="buy-18" data-val="0">--</span>
                </div>
                <div class="mini-row">
                    <span class="mini-label">بيع</span>
                    <span class="sell skeleton-text" id="sell-18" data-val="0">--</span>
                </div>
            </div>

            <div class="glass-card karat-mini">
                <div class="title">عيار 14</div>
                <div class="mini-row">
                    <span class="mini-label">شراء</span>
                    <span class="buy skeleton-text" id="buy-14" data-val="0">--</span>
                </div>
                <div class="mini-row">
                    <span class="mini-label">بيع</span>
                    <span class="sell skeleton-text" id="sell-14" data-val="0">--</span>
                </div>
            </div>
        </div>

        <div class="glass-card info-card full-width">
            <div class="info-title" style="margin:0; font-size: 1rem; color: var(--gold-primary); font-weight: bold;">سعر الجنيه الذهب</div>
            <div class="info-value skeleton-text" id="gold-coin" data-val="0" style="font-size: 1.5rem;">----</div>
        </div>

        <div class="info-grid">
            <div class="glass-card info-card">
                <div class="info-title">الفجوة السعرية (21)</div>
                <div class="info-value gap-value skeleton-text" id="price-gap" data-val="0">--</div>
            </div>
            
            <div class="glass-card info-card">
                <div class="info-title">دولار الصاغة (تقريبي)</div>
                <div class="info-value skeleton-text" id="sagha-dollar" data-val="0" style="color: var(--text-main);">--</div>
            </div>

            <div class="glass-card info-card full-width" style="padding: 12px 15px;">
                <div class="info-title" style="margin:0;">السعر العالمي (أونصة)</div>
                <div class="info-value" id="global-ounce">2,350 $</div> </div>
        </div>

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxHEks-97V2ca9y3GroLBkuq6SDXUpENiHyCk88_fhHY16gGYnsBg6Bc0YLfKxYOW8bQw/exec";
        const GLOBAL_OUNCE_PRICE = 2350; // سعر افتراضي للأونصة حتى يتم ربطه بمصدر حي

        // 1. دالة الحماية ضد الـ NaN (تضمن إرجاع رقم صحيح دائماً)
        function safeNum(val) {
            const num = parseFloat(val);
            if (isNaN(num) || !isFinite(num)) return 0;
            return num;
        }

        // 2. دالة عداد الأرقام المتحرك (Animation Counter)
        function animateValue(element, start, end, duration) {
            if (start === end) return;
            
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                
                // Ease Out effect
                const easeOut = 1 - Math.pow(1 - progress, 3); 
                const currentVal = (progress === 1) ? end : start + (end - start) * easeOut;
                
                // تحديد عدد الخانات العشرية بناءً على الرقم
                const decimals = (end % 1 !== 0 && end < 100) ? 2 : 0; 
                element.innerText = currentVal.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
                
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // 3. دالة تحديث العنصر الشاملة (تزيل الـ Skeleton وتنفذ الوميض والعداد)
        function updateElement(id, newValue) {
            const el = document.getElementById(id);
            if (!el) return;

            const safeNewValue = safeNum(newValue);
            const oldValue = safeNum(el.getAttribute('data-val'));

            // إزالة هيكل التحميل إن وُجد
            if(el.classList.contains('skeleton-text')) {
                el.classList.remove('skeleton-text');
            }

            if (safeNewValue === 0) {
                el.innerText = "--";
                return;
            }

            if (safeNewValue !== oldValue) {
                // تفعيل تأثير الوميض
                el.classList.remove('flash');
                void el.offsetWidth; // Trigger Reflow
                el.classList.add('flash');

                // تحريك الأرقام
                animateValue(el, oldValue, safeNewValue, 1200);
                
                // حفظ القيمة الجديدة
                el.setAttribute('data-val', safeNewValue);
            }
        }

        // 4. الدالة الرئيسية لجلب البيانات وحسابها
        async function fetchPrices() {
            const btn = document.getElementById('refresh-btn');
            const updateTimeEl = document.getElementById('last-update-time');
            
            // تشغيل دوران زر التحديث
            btn.classList.add('spinning');
            updateTimeEl.innerText = "جاري التحديث...";

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // استخراج قيم 21 بأمان
                const buy21 = safeNum(data["شراء 21"]);
                const sell21 = safeNum(data["بيع 21"]);

                if(buy21 === 0 || sell21 === 0) throw new Error("بيانات غير صالحة من المصدر");

                // تحديث عيار 21
                updateElement('buy-21', buy21);
                updateElement('sell-21', sell21);

                // حساب وتحديث باقي العيارات (نفس نظام الصاغة)
                updateElement('buy-24', Math.round(buy21 * (24/21)));
                updateElement('sell-24', Math.round(sell21 * (24/21)));

                updateElement('buy-18', Math.round(buy21 * (18/21)));
                updateElement('sell-18', Math.round(sell21 * (18/21)));

                updateElement('buy-14', Math.round(buy21 * (14/21)));
                updateElement('sell-14', Math.round(sell21 * (14/21)));

                // الجنيه الذهب (8 جرام من عيار 21) - استخدام سعر البيع للجمهور
                updateElement('gold-coin', Math.round(buy21 * 8));

                // الفجوة السعرية (الفرق بين شراء وبيع الصائغ)
                const gap = Math.abs(buy21 - sell21);
                updateElement('price-gap', gap);

                // دولار الصاغة التقريبي
                const local24 = sell21 * (24/21);
                const saghaDollar = local24 / (GLOBAL_OUNCE_PRICE / 31.103);
                updateElement('sagha-dollar', saghaDollar);

                // تحديث وقت نجاح العملية
                const now = new Date();
                updateTimeEl.innerText = "آخر تحديث: " + now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            } catch (error) {
                console.error("Fetch error:", error);
                updateTimeEl.innerText = "فشل التحديث، يرجى المحاولة لاحقاً";
                // في حالة الخطأ، نوقف تأثير التحميل ونظهر شرطات
                document.querySelectorAll('.skeleton-text').forEach(el => {
                    el.classList.remove('skeleton-text');
                    if(el.getAttribute('data-val') == "0") el.innerText = "--";
                });
            } finally {
                // إيقاف دوران زر التحديث
                setTimeout(() => btn.classList.remove('spinning'), 500);
            }
        }

        // تشغيل الجلب التلقائي عند فتح الصفحة
        window.onload = fetchPrices;
    </script>
</body>
</html>
