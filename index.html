<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسعار الذهب - مصوغات الصعيدي</title>
    <!-- مكتبة تليجرام الأساسية عشان الموقع يفتح كـ Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #d4af37; /* لون دهبي */
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        h2 { margin: 0 0 10px 0; color: #fff; }
        .price { font-size: 24px; font-weight: bold; }
        .buy-sell { display: flex; justify-content: space-around; color: #ccc; }
    </style>
</head>
<body>

    <!-- اللوجو أو اسم البراند -->
    <h1>مصوغات محمد الصعيدي</h1>

    <div class="card">
        <h2>عيار 21</h2>
        <div class="buy-sell">
            <div>شراء: <span class="price" id="buy21">جاري التحميل...</span></div>
            <div>بيع: <span class="price" id="sell21">جاري التحميل...</span></div>
        </div>
    </div>

    <div class="card">
        <h2>عيار 24</h2>
        <div class="buy-sell">
            <div>شراء: <span class="price" id="buy24">-</span></div>
            <div>بيع: <span class="price" id="sell24">-</span></div>
        </div>
    </div>

    <div class="card">
        <h2>عيار 18</h2>
        <div class="buy-sell">
            <div>شراء: <span class="price" id="buy18">-</span></div>
            <div>بيع: <span class="price" id="sell18">-</span></div>
        </div>
    </div>

    <div class="card">
        <h2>الجنيه الذهب (8 جرام)</h2>
        <div class="buy-sell">
            <div>شراء: <span class="price" id="buyCoin">-</span></div>
            <div>بيع: <span class="price" id="sellCoin">-</span></div>
        </div>
    </div>

    <script>
        // إخبار تليجرام إن التطبيق جاهز للعرض
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand(); // لفتح التطبيق بكامل الشاشة

        // حط الرابط اللي أخدته من جوجل شيت هنا
        const API_URL = "https://script.google.com/macros/s/AKfycbxHEks-97V2ca9y3GroLBkuq6SDXUpENiHyCk88_fhHY16gGYnsBg6Bc0YLfKxYOW8bQw/exec";

        async function fetchPrices() {
            try {
                let response = await fetch(API_URL);
                let data = await response.json();
                
                let b21 = parseFloat(data.buy21);
                let s21 = parseFloat(data.sell21);

                // العمليات الحسابية
                let b24 = (b21 / 21) * 24;
                let s24 = (s21 / 21) * 24;
                
                let b18 = (b21 / 21) * 18;
                let s18 = (s21 / 21) * 18;

                let bCoin = b21 * 8;
                let sCoin = s21 * 8;

                // عرض الأرقام في الموقع بعد تقريبها
                document.getElementById("buy21").innerText = Math.round(b21);
                document.getElementById("sell21").innerText = Math.round(s21);
                
                document.getElementById("buy24").innerText = Math.round(b24);
                document.getElementById("sell24").innerText = Math.round(s24);
                
                document.getElementById("buy18").innerText = Math.round(b18);
                document.getElementById("sell18").innerText = Math.round(s18);

                document.getElementById("buyCoin").innerText = Math.round(bCoin);
                document.getElementById("sellCoin").innerText = Math.round(sCoin);

                
            } catch (error) {
                document.getElementById("buy21").innerText = "خطأ في التحميل";
            }
        }

        fetchPrices();
    </script>
</body>
</html>
