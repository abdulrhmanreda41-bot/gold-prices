<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصوغات محمد الصعيدي</title>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    
    <style>
        :root {
            --bg-base: #020604;
            --bg-surface: #0a140d;
            --glass-bg: rgba(14, 28, 18, 0.6);
            --glass-border: rgba(212, 175, 55, 0.12);
            --glass-highlight: rgba(255, 255, 255, 0.03);
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-dark: #997A15;
            --text-primary: #F8FAF9;
            --text-secondary: #8BA696;
            --success-color: #00E676;
            --danger-color: #FF3D00;
            --card-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            --inner-glow: inset 0 1px 0 rgba(212, 175, 55, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.03), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 230, 118, 0.02), transparent 25%);
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 15px;
        }

        .dashboard {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* --- Top Navigation / Header --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px 10px;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 5px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title {
            font-family: 'Aref Ruqaa', serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--gold-light), var(--gold-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0;
            padding-top: 5px;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            background: rgba(0,0,0,0.3);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
        }

        .status-dot.live {
            background-color: var(--success-color);
            animation: pulse-green 2s infinite;
        }
        
        .status-dot.error {
            background-color: var(--danger-color);
            animation: pulse-red 2s infinite;
        }

        /* --- Premium Cards --- */
        .premium-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--card-shadow), var(--inner-glow);
            position: relative;
            overflow: hidden;
        }

        /* --- Main 21 Karat Card --- */
        .card-21 {
            background: linear-gradient(165deg, rgba(20, 40, 25, 0.8) 0%, rgba(5, 12, 8, 0.9) 100%);
            border: 1px solid rgba(212, 175, 55, 0.25);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .karat-badge {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: #000;
            padding: 6px 20px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-refresh {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold-dark);
            color: var(--gold-light);
            width: 36px; height: 36px;
            border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-refresh:hover {
            background: var(--gold-primary);
            color: #000;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        .btn-refresh.spinning svg { animation: spin 0.8s linear infinite; }

        .price-layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-block {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        
        .price-block.sell-block { align-items: flex-start; }
        .price-block.buy-block { align-items: flex-end; }

        .price-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .price-val {
            font-size: 2.2rem;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .buy-block .price-val { color: var(--gold-light); text-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
        .sell-block .price-val { color: var(--text-primary); }

        .currency {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-right: 4px;
        }

        .divider-vertical {
            width: 1px;
            height: 50px;
            background: linear-gradient(to bottom, transparent, var(--glass-border), transparent);
        }

        /* --- Grid for 24, 18, 14 --- */
        .karat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .mini-card {
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top: 1px solid var(--glass-highlight);
        }

        .mini-title {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 800;
            margin-bottom: 12px;
            width: 100%;
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
        }

        .mini-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .mini-row:last-child { margin-bottom: 0; }

        .m-label { font-size: 0.75rem; color: var(--text-secondary); }
        .m-val { font-size: 1rem; font-weight: 800; font-variant-numeric: tabular-nums; }
        .m-val.buy { color: var(--gold-primary); }

        /* --- Info Grid (Coin, Gap, etc.) --- */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .info-card {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-left: 2px solid transparent;
            transition: border-color 0.3s ease;
        }
        
        .info-card:hover { border-left-color: var(--gold-primary); }

        .info-card.full {
            grid-column: span 2;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.05), transparent);
        }

        .i-head {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .i-val {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--text-primary);
        }

        .gap-alert { color: var(--danger-color); }
        
        /* --- Animations --- */
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(0, 230, 118, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
        }
        
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 61, 0, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(255, 61, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 61, 0, 0); }
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .data-flash {
            animation: dataUpdate 0.5s ease-out;
        }
        
        @keyframes dataUpdate {
            0% { color: var(--success-color); transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* SVG Styles */
        svg { width: 16px; height: 16px; fill: currentColor; }
        .gold-icon { fill: var(--gold-primary); }
    </style>
</head>
<body>

    <div class="dashboard">
        
        <div class="navbar">
            <div class="brand">
                <svg viewBox="0 0 24 24" class="gold-icon" style="width: 24px; height: 24px;"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                <span class="brand-title">مصوغات محمد الصعيدي</span>
            </div>
            <div class="system-status" id="sys-status">
                <span class="status-dot" id="status-indicator"></span>
                <span id="status-text">بانتظار الاتصال</span>
            </div>
        </div>

        <div class="premium-card card-21">
            <div class="card-header">
                <div class="karat-badge">
                    <svg viewBox="0 0 24 24"><path d="M20 5H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 12H4V7h16v10z"/><path d="M11 9h2v6h-2z"/></svg>
                    عيار 21
                </div>
                <button class="btn-refresh" id="btn-refresh" onclick="fetchMarketData()">
                    <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                </button>
            </div>

            <div class="price-layout">
                <div class="price-block sell-block">
                    <span class="price-label">بيع <svg viewBox="0 0 24 24"><path d="M16 18l2.29-2.29-4.88-4.88-4 4L2 9.41 3.41 8l6 6 4-4 6.3 6.29L22 14v4h-6z"/></svg></span>
                    <div class="price-val" id="val-sell-21">--<span class="currency">ج</span></div>
                </div>
                
                <div class="divider-vertical"></div>
                
                <div class="price-block buy-block">
                    <span class="price-label">شراء <svg viewBox="0 0 24 24" style="fill: var(--gold-primary)"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 14.59 3.41 16l6-6 4 4 6.3-6.29L22 10V6h-6z"/></svg></span>
                    <div class="price-val" id="val-buy-21">--<span class="currency">ج</span></div>
                </div>
            </div>
        </div>

        <div class="karat-grid">
            <div class="premium-card mini-card">
                <div class="mini-title">عيار 24</div>
                <div class="mini-row"><span class="m-label">شراء</span><span class="m-val buy" id="val-buy-24">--</span></div>
                <div class="mini-row"><span class="m-label">بيع</span><span class="m-val" id="val-sell-24">--</span></div>
            </div>
            <div class="premium-card mini-card">
                <div class="mini-title">عيار 18</div>
                <div class="mini-row"><span class="m-label">شراء</span><span class="m-val buy" id="val-buy-18">--</span></div>
                <div class="mini-row"><span class="m-label">بيع</span><span class="m-val" id="val-sell-18">--</span></div>
            </div>
            <div class="premium-card mini-card">
                <div class="mini-title">عيار 14</div>
                <div class="mini-row"><span class="m-label">شراء</span><span class="m-val buy" id="val-buy-14">--</span></div>
                <div class="mini-row"><span class="m-label">بيع</span><span class="m-val" id="val-sell-14">--</span></div>
            </div>
        </div>

        <div class="info-grid">
            <div class="premium-card info-card full">
                <div class="i-head">
                    <svg viewBox="0 0 24 24" class="gold-icon"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.3.9 2.3 1.78 0 .96-.86 1.54-2.22 1.54-1.3 0-2.07-.63-2.17-1.68H8.03c.12 1.76 1.33 2.8 2.87 3.19V19h2.4v-1.69c1.61-.31 2.84-1.35 2.84-2.97 0-2.01-1.65-2.78-3.83-3.2z"/></svg>
                    سعر الجنيه الذهب
                </div>
                <div class="i-val" id="val-coin">-- <span class="currency">ج</span></div>
            </div>

            <div class="premium-card info-card full">
                <div class="i-head">
                    <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95c-.32-1.25-.78-2.45-1.38-3.56 1.84.63 3.37 1.91 4.33 3.56zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2s.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56-1.84-.63-3.37-1.9-4.33-3.56zm2.95-8H5.08c.96-1.66 2.49-2.93 4.33-3.56C8.81 5.55 8.35 6.75 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2s.07-1.35.16-2h4.68c.09.65.16 1.32.16 2s-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95c-.96 1.65-2.49 2.93-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2s-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>
                    السعر العالمي (أونصة)
                </div>
                <div class="i-val" style="color: var(--gold-light);" id="val-ounce">2,350 <span class="currency" style="color: var(--gold-primary);">$</span></div>
            </div>

            <div class="premium-card info-card">
                <div class="i-head">الفجوة السعرية</div>
                <div class="i-val gap-alert" id="val-gap">--</div>
            </div>

            <div class="premium-card info-card">
                <div class="i-head">دولار الصاغة</div>
                <div class="i-val" id="val-dollar">--</div>
            </div>
        </div>

    </div>

    <script>
        // ضع الرابط الخاص بك بين علامتي التنصيص هنا
        const API_URL = "https://script.google.com/macros/s/AKfycbxHEks-97V2ca9y3GroLBkuq6SDXUpENiHyCk88_fhHY16gGYnsBg6Bc0YLfKxYOW8bQw/exec";
        const GLOBAL_OUNCE = 2350; 

        function setNode(id, val, format = true) {
            const el = document.getElementById(id);
            if(!el) return;
            
            const oldVal = el.getAttribute('data-v');
            const newVal = format ? val.toLocaleString('en-US') : val;
            
            if (oldVal !== newVal) {
                el.classList.remove('data-flash');
                void el.offsetWidth; 
                el.classList.add('data-flash');
                
                if(id === 'val-sell-21' || id === 'val-buy-21' || id === 'val-coin') {
                    el.innerHTML = `${newVal} <span class="currency">ج</span>`;
                } else {
                    el.innerText = newVal;
                }
                el.setAttribute('data-v', newVal);
            }
        }

        function setStatus(type) {
            const dot = document.getElementById('status-indicator');
            const txt = document.getElementById('status-text');
            dot.className = 'status-dot';
            
            if (type === 'live') {
                dot.classList.add('live');
                txt.innerText = 'متصل ومُحدث';
                txt.style.color = 'var(--success-color)';
            } else if (type === 'error') {
                dot.classList.add('error');
                txt.innerText = 'فشل الاتصال بالشيت';
                txt.style.color = 'var(--danger-color)';
            } else {
                txt.innerText = 'جاري جلب البيانات...';
                txt.style.color = 'var(--text-secondary)';
            }
        }

        async function fetchMarketData() {
            const btn = document.getElementById('btn-refresh');
            btn.classList.add('spinning');
            setStatus('loading');

            try {
                // التعديل 1: إضافة { redirect: "follow" } لدعم إعادة توجيه جوجل
                const res = await fetch(API_URL, {
                    method: 'GET',
                    redirect: 'follow' 
                });
                
                if (!res.ok) throw new Error('Network Issue');
                const data = await res.json();

                // التعديل 2: التعامل مع البيانات سواء كانت كائن (Object) مباشر أو مصفوفة (Array) بداخلها البيانات
                const resultData = Array.isArray(data) ? data[0] : data;

                const buy21 = parseFloat(resultData["شراء 21"]);
                const sell21 = parseFloat(resultData["بيع 21"]);

                if (isNaN(buy21) || isNaN(sell21)) {
                    console.log("البيانات المستلمة من جوجل:", data); // تساعدك في فحص الخطأ إذا حدث مجدداً
                    throw new Error('Data Empty or Invalid Key');
                }

                // 21k
                setNode('val-buy-21', buy21);
                setNode('val-sell-21', sell21);

                // Calculations
                setNode('val-buy-24', Math.round(buy21 * (24/21)));
                setNode('val-sell-24', Math.round(sell21 * (24/21)));
                setNode('val-buy-18', Math.round(buy21 * (18/21)));
                setNode('val-sell-18', Math.round(sell21 * (18/21)));
                setNode('val-buy-14', Math.round(buy21 * (14/21)));
                setNode('val-sell-14', Math.round(sell21 * (14/21)));
                
                // Coin & Indicators
                setNode('val-coin', Math.round(sell21 * 8));
                setNode('val-gap', (sell21 - buy21).toFixed(2), false);

                const saghaDollar = (sell21 * (24/21)) / (GLOBAL_OUNCE / 31.103);
                setNode('val-dollar', saghaDollar.toFixed(2), false);

                setStatus('live');

            } catch (error) {
                console.error("تفاصيل الخطأ:", error);
                setStatus('error');
            } finally {
                setTimeout(() => btn.classList.remove('spinning'), 500);
            }
        }

        window.onload = fetchMarketData;
    </script>
</body>
</html>
